plugins {
    id 'com.android.application'
}

android {
    namespace 'moe.umbrella.marimo'
    compileSdk 35

    defaultConfig {
        applicationId "moe.umbrella.marimo"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // the C core .so is built by android/Makefile (NDK) into
    // app/src/main/jniLibs/<abi>/libmarimo_core.so — gradle just packages it.
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
