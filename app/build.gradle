plugins {
    id 'com.android.application'
}

android {
    namespace 'moe.umbrella.marimo'
    compileSdk 36

    defaultConfig {
        applicationId "moe.umbrella.marimo"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1"
    }

    signingConfigs {
        release {
            def kh = System.getenv("MARIMO_KEYSTORE")
            if (kh) {
                storeFile file(kh)
                storePassword System.getenv("MARIMO_KEYSTORE_PASSWORD")
                keyAlias System.getenv("MARIMO_KEY_ALIAS")
                keyPassword System.getenv("MARIMO_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // signed with the marimo release keystore (local, outside the repo).
            // set MARIMO_KEYSTORE / *_PASSWORD / MARIMO_KEY_ALIAS when building.
            def kh = System.getenv("MARIMO_KEYSTORE")
            def sp = System.getenv("MARIMO_KEYSTORE_PASSWORD")
            def kp = System.getenv("MARIMO_KEY_PASSWORD")
            def al = System.getenv("MARIMO_KEY_ALIAS")
            if (kh && sp && kp && al) {
                signingConfig signingConfigs.release
            }
        }
    }

    // the C core .so is built by android/Makefile (NDK) into
    // app/src/main/jniLibs/<abi>/libmarimo_core.so — gradle just packages it.
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.media3:media3-exoplayer:1.10.1'
    implementation 'androidx.media3:media3-session:1.10.1'
    implementation 'androidx.media3:media3-ui:1.10.1'
    implementation 'androidx.media:media:1.7.0'
}
